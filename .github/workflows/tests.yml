name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Unit and integration tests (no API writes)
        run: python -m unittest discover -s tests -v
      - name: Validate accepted review dataset
        run: python -m scripts.reviews.check
      - name: Check generated rankings are reproducible
        run: |
          python -m scripts.reviews.rankings
          python -m scripts.reviews.rankings --check
