---
name: Submit a Big Mac review
description: Share a visit. We create the review PR for you.
title: "[Review] McDonald's at [street address], [city], [state], [country]"
body:
- type: markdown
  attributes:
    value: |-
      ## Original Big Mac only
      No extras, no ingredients removed, and no special editions. Submit this form; automation creates a review PR for a maintainer to review. No fork or manual PR is needed.

      For scored reviews, all five scores, an exact date, and a Google Maps link are required. For memory reviews, leave the scores unselected; unknown dates and locations may be omitted. Memory reviews never count toward restaurant averages.

      Replace the bracketed parts of the title with the restaurant's street address, city, state, and country.
- type: dropdown
  id: recipe
  attributes:
    label: Big Mac recipe
    options:
    - Original standard local recipe
    default: 0
  validations:
    required: true
- type: dropdown
  id: contribution_type
  attributes:
    label: Contribution type
    options:
    - New scored review
    - Review from memory
    - Correction
  validations:
    required: true
- type: input
  id: original_issue
  attributes:
    label: Original review issue number
    description: 'Corrections only: the original review issue number, not the PR number.'
- type: dropdown
  id: corrected_type
  attributes:
    label: Corrected review type
    description: 'Corrections only: select the type of the replacement review.'
    options:
    - Scored review
    - Review from memory
- type: input
  id: maps
  attributes:
    label: Google Maps link
    description: Open the exact restaurant in Google Maps → Share → Copy link. Required
      for scored reviews. Unknown for a memory review? Leave blank and explain in Overall experience.
- type: input
  id: visit_date
  attributes:
    label: Visit date
    description: YYYY-MM-DD for scored reviews. An approximate date is welcome for
      memory reviews.
- type: dropdown
  id: order_type
  attributes:
    label: Order type
    options:
    - Dine-in
    - Takeout
    - Delivery
  validations:
    required: true
- type: dropdown
  id: score_0
  attributes:
    label: Flavor and balance score
    description: 1 very poor · 2 below expectations · 3 good/standard · 4 very good
      · 5 exceptional
    options:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
- type: dropdown
  id: score_1
  attributes:
    label: Texture score
    description: 1 very poor · 2 below expectations · 3 good/standard · 4 very good
      · 5 exceptional
    options:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
- type: dropdown
  id: score_2
  attributes:
    label: Temperature score
    description: 1 very poor · 2 below expectations · 3 good/standard · 4 very good
      · 5 exceptional
    options:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
- type: dropdown
  id: score_3
  attributes:
    label: Perceived freshness score
    description: 1 very poor · 2 below expectations · 3 good/standard · 4 very good
      · 5 exceptional
    options:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
- type: dropdown
  id: score_4
  attributes:
    label: Assembly score
    description: 1 very poor · 2 below expectations · 3 good/standard · 4 very good
      · 5 exceptional
    options:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
- type: textarea
  id: experience
  attributes:
    label: Overall experience
    description: 'Optional. What stood out? You can mention price, service, atmosphere,
      or photos here; they do not affect scores. For memory reviews, state what is
      uncertain. Avoid adding headings starting with ###.'
- type: checkboxes
  id: confirmations
  attributes:
    label: Confirmations
    options:
    - label: I personally ate this Big Mac.
      required: true
    - label: 'It was the original standard local recipe: no extras, no ingredients
        removed, and no special edition.'
      required: true
    - label: I have permission to share any photos included.
      required: true
